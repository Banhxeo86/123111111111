<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 반 교실 대시보드</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 구글 폰트: 눈에 잘 띄고 또렷한 프리텐다드 / Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .font-jua {
      font-family: 'Jua', 'Noto Sans KR', sans-serif;
    }
    /* 은은하고 부드러운 밝은 파스텔톤 애니메이션 배경 */
    .pastel-bg {
      background: linear-gradient(135deg, #e0f2fe 0%, #fef3c7 50%, #fce7f3 100%);
      background-size: 200% 200%;
      animation: gradientShift 20s ease infinite;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    /* 카드 반투명 글래스모피즘 효과 */
    .glass-card {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.05), 0 10px 15px -5px rgba(0, 0, 0, 0.02);
    }
  </style>
</head>
<body class="pastel-bg h-screen w-screen overflow-hidden flex flex-col p-4 md:p-6 lg:p-8 text-slate-800 transition-all">

  <!-- 상단 컨트롤 바 (전체화면, 내용 편집 모드) -->
  <div class="flex justify-between items-center mb-3 px-2">
    <div class="flex items-center gap-3">
      <span class="inline-flex items-center px-4 py-1.5 rounded-full bg-white/70 text-indigo-700 font-bold text-lg shadow-sm border border-white">
        <i data-lucide="sparkles" class="w-5 h-5 mr-2 text-amber-500"></i>
        행복하고 활기찬 우리 반 ✨
      </span>
    </div>
    <div class="flex items-center gap-2">
      <button id="editToggleBtn" onclick="toggleEditMode()" class="px-3.5 py-1.5 text-sm md:text-base font-semibold rounded-xl bg-white/80 hover:bg-white text-slate-700 shadow-sm border border-white transition-all flex items-center gap-1.5 cursor-pointer">
        <i data-lucide="edit-3" class="w-4 h-4 text-sky-600"></i>
        <span>내용 수정</span>
      </button>
      <button onclick="toggleFullScreen()" class="px-3.5 py-1.5 text-sm md:text-base font-semibold rounded-xl bg-white/80 hover:bg-white text-slate-700 shadow-sm border border-white transition-all flex items-center gap-1.5 cursor-pointer">
        <i data-lucide="maximize" class="w-4 h-4 text-emerald-600"></i>
        <span>전체화면</span>
      </button>
    </div>
  </div>

  <!-- [상단 영역] 날짜, 요일 및 실시간 디지털 시계 (교실 뒤에서도 보이도록 초대형 폰트) -->
  <header class="glass-card rounded-3xl p-4 lg:p-6 mb-5 flex flex-col items-center justify-center text-center shadow-lg transition-all">
    <!-- 날짜 & 요일 -->
    <div class="flex items-center justify-center gap-3 md:gap-5 flex-wrap">
      <span id="currentDate" class="text-2xl sm:text-3xl md:text-4xl lg:text-5xl font-bold text-slate-700 tracking-tight">
        2026년 11월 3일
      </span>
      <span id="currentDay" class="px-4 py-1 rounded-2xl bg-amber-200/80 text-amber-900 font-extrabold text-2xl sm:text-3xl md:text-4xl shadow-sm">
        화요일
      </span>
    </div>

    <!-- 초대형 디지털 시계 (1초마다 업데이트) -->
    <div class="mt-1 flex items-baseline justify-center tracking-tight font-jua">
      <span id="timeAmpm" class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl text-sky-600 font-bold mr-3 md:mr-5">
        오후
      </span>
      <span id="timeClock" class="text-6xl sm:text-7xl md:text-8xl lg:text-9xl font-black text-slate-800 tracking-normal drop-shadow-sm">
        03:58:00
      </span>
    </div>
  </header>

  <!-- [하단 영역] 둘로 나뉜 급식과 날씨 정보 (반반 분할) -->
  <main class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-5 min-h-0">
    
    <!-- 왼쪽: 오늘 급식 카드 -->
    <section class="glass-card rounded-3xl p-5 md:p-6 lg:p-7 flex flex-col min-h-0 shadow-lg border-t-4 border-amber-300">
      <!-- 카드 헤더 -->
      <div class="flex items-center justify-between pb-3 border-b border-slate-200/80">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 lg:w-14 lg:h-14 rounded-2xl bg-amber-100 flex items-center justify-center text-amber-600 shadow-inner">
            <i data-lucide="utensils" class="w-7 h-7 lg:w-8 lg:h-8"></i>
          </div>
          <div>
            <h2 class="text-2xl lg:text-3xl font-black text-slate-800 tracking-tight">오늘의 맛있는 급식</h2>
            <p id="lunchStatusSubtext" class="text-sm lg:text-base font-semibold text-slate-500">골고루 꼭꼭 씹어 먹어요</p>
          </div>
        </div>
        <span class="text-xs lg:text-sm font-bold px-3 py-1 bg-amber-100/80 text-amber-800 rounded-full">중식 식단</span>
      </div>

      <!-- 급식 메뉴 목록 (나이스 API 실시간 연동) -->
      <div class="flex-1 flex flex-col justify-around py-3 px-2 overflow-y-auto">
        <ul id="lunchMenuList" class="space-y-2 lg:space-y-3 text-slate-800">
          <li class="flex items-center justify-center p-6 text-slate-400 font-bold text-xl">
            급식 정보를 불러오는 중입니다...
          </li>
        </ul>
      </div>

      <!-- 하단 알레르기/칼로리 미니 정보 -->
      <div class="pt-2 text-xs md:text-sm font-semibold text-slate-400 border-t border-slate-200/60 flex justify-between items-center">
        <span id="lunchCalorie">열량 정보 조회 중</span>
        <span>출처: 나이스(NEIS) 교육정보</span>
      </div>
    </section>

    <!-- 오른쪽: 오늘 날씨 카드 -->
    <section class="glass-card rounded-3xl p-5 md:p-6 lg:p-7 flex flex-col min-h-0 shadow-lg border-t-4 border-sky-300">
      <!-- 카드 헤더 -->
      <div class="flex items-center justify-between pb-3 border-b border-slate-200/80">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 lg:w-14 lg:h-14 rounded-2xl bg-sky-100 flex items-center justify-center text-sky-600 shadow-inner">
            <i data-lucide="cloud-sun" class="w-7 h-7 lg:w-8 lg:h-8"></i>
          </div>
          <div>
            <h2 class="text-2xl lg:text-3xl font-black text-slate-800 tracking-tight">오늘의 날씨</h2>
            <p id="weatherSubtext" class="text-sm lg:text-base font-semibold text-slate-500">맑고 화창한 날씨예요!</p>
          </div>
        </div>
        <span class="text-xs lg:text-sm font-bold px-3 py-1 bg-sky-100/80 text-sky-800 rounded-full">실시간 예보</span>
      </div>

      <!-- 메인 날씨 & 기온 -->
      <div class="flex-1 flex flex-col justify-center items-center py-2">
        <div class="flex items-center justify-center gap-4 lg:gap-6 my-auto">
          <!-- 날씨 큰 이모지/아이콘 -->
          <div id="weatherIcon" class="text-6xl sm:text-7xl lg:text-8xl select-none filter drop-shadow">
            ⏳
          </div>
          <div class="flex flex-col">
            <div class="flex items-start">
              <span id="weatherTemp" class="text-5xl sm:text-6xl lg:text-7xl font-black text-slate-800 tracking-tighter">--</span>
              <span class="text-3xl lg:text-4xl font-bold text-sky-600 ml-1">°C</span>
            </div>
            <span id="weatherStatus" class="text-xl sm:text-2xl lg:text-3xl font-extrabold text-slate-700">날씨 불러오는 중...</span>
          </div>
        </div>

        <!-- 미세먼지 및 추가 날씨 카드 그리드 -->
        <div class="grid grid-cols-3 gap-2 sm:gap-3 w-full mt-3">
          <!-- 체감 온도 -->
          <div class="bg-indigo-50 border border-indigo-200 rounded-2xl p-2.5 sm:p-3 text-center flex flex-col justify-center">
            <span class="text-xs sm:text-sm font-bold text-slate-500">체감 온도</span>
            <span id="apparentTemp" class="text-base sm:text-lg lg:text-xl font-black text-indigo-700 mt-0.5">--°C</span>
          </div>
          <!-- 최고/최저 기온 -->
          <div class="bg-amber-50 border border-amber-200 rounded-2xl p-2.5 sm:p-3 text-center flex flex-col justify-center">
            <span class="text-xs sm:text-sm font-bold text-slate-500">최저 / 최고</span>
            <span id="minMaxTemp" class="text-base sm:text-lg lg:text-xl font-black text-amber-700 mt-0.5">--° / --°</span>
          </div>
          <!-- 습도 -->
          <div class="bg-sky-50 border border-sky-200 rounded-2xl p-2.5 sm:p-3 text-center flex flex-col justify-center">
            <span class="text-xs sm:text-sm font-bold text-slate-500">습도</span>
            <span id="humidityVal" class="text-lg sm:text-xl lg:text-2xl font-black text-sky-600 mt-0.5">--% 💧</span>
          </div>
        </div>
      </div>

      <!-- 하단 알림 팁 -->
      <div class="pt-2 text-xs md:text-sm font-semibold text-slate-500 border-t border-slate-200/60 flex items-center gap-1.5">
        <i data-lucide="info" class="w-4 h-4 text-sky-500"></i>
        <span id="weatherNotice">Open-Meteo 실시간 기상 데이터를 불러옵니다.</span>
      </div>
    </section>

  </main>

  <!-- 간단 안내 토스트 모달 (편집 모드 시) -->
  <div id="editNoticeToast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white px-5 py-2.5 rounded-full text-sm font-medium shadow-xl opacity-0 pointer-events-none transition-all duration-300">
    텍스트를 직접 클릭해 수정할 수 있습니다.
  </div>

  <script>
    // Lucide 아이콘 초기화
    lucide.createIcons();

    // 나이스 API 설정
    const NEIS_CONFIG = {
      officeCode: 'K10',      // 시도교육청코드
      schoolCode: '7812054',  // 표준학교코드
      mealCode: '2'           // 2: 중식
    };

    // Open-Meteo 날씨 API 설정 (학교 위치: 위도 37.82, 경도 127.72)
    const WEATHER_CONFIG = {
      latitude: 37.82,
      longitude: 127.72
    };

    let lastLoadedDateStr = '';

    // WMO 날씨 코드 해석 함수
    function interpretWeatherCode(code, isDay = 1) {
      switch (code) {
        case 0:
          return { icon: isDay ? '☀️' : '🌙', desc: '맑음', tip: '하늘이 맑고 쾌적한 하루입니다!' };
        case 1:
        case 2:
          return { icon: isDay ? '🌤️' : '☁️', desc: '대체로 맑음', tip: '구름이 조금 지나가지만 쾌적해요!' };
        case 3:
          return { icon: '☁️', desc: '흐림', tip: '구름이 많아요. 실내 공기를 쾌적하게 유지해요.' };
        case 45:
        case 48:
          return { icon: '🌫️', desc: '안개', tip: '시야가 흐리니 이동할 때 차를 조심하세요.' };
        case 51:
        case 53:
        case 55:
          return { icon: '🌦️', desc: '이슬비', tip: '약한 비가 내립니다. 작은 우산을 챙기세요.' };
        case 61:
        case 63:
        case 65:
          return { icon: '🌧️', desc: '비', tip: '비가 내립니다. 빗길에 미끄러지지 않게 조심하세요!' };
        case 71:
        case 73:
        case 75:
        case 77:
          return { icon: '❄️', desc: '눈', tip: '눈이 내려요! 빙판길을 걷지 않도록 주의해요.' };
        case 80:
        case 81:
        case 82:
          return { icon: '🌦️', desc: '소나기', tip: '갑작스러운 소나기가 올 수 있으니 우산을 챙기세요.' };
        case 85:
        case 86:
          return { icon: '🌨️', desc: '눈 소나기', tip: '눈이 날리고 있습니다. 옷을 따뜻하게 입으세요.' };
        case 95:
        case 96:
        case 99:
          return { icon: '⛈️', desc: '뇌우', tip: '천둥 번개를 동반한 비가 오니 외출 시 주의하세요!' };
        default:
          return { icon: '🌡️', desc: '보통', tip: '오늘 하루도 활기차고 건강하게 보내세요!' };
      }
    }

    // Open-Meteo API 날씨 호출 함수
    async function fetchSchoolWeather() {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${WEATHER_CONFIG.latitude}&longitude=${WEATHER_CONFIG.longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FSeoul`;

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('날씨 응답 오류');
        const data = await response.json();

        // 1. 현재 기온 및 상태
        const currentTemp = Math.round(data.current.temperature_2m);
        const apparentTemp = Math.round(data.current.apparent_temperature);
        const humidity = data.current.relative_humidity_2m;
        const weatherInfo = interpretWeatherCode(data.current.weather_code, data.current.is_day);

        // 2. 일 최고 / 최저 기온
        const maxTemp = Math.round(data.daily.temperature_2m_max[0]);
        const minTemp = Math.round(data.daily.temperature_2m_min[0]);

        // DOM 업데이트
        document.getElementById('weatherTemp').innerText = currentTemp;
        document.getElementById('weatherIcon').innerText = weatherInfo.icon;
        document.getElementById('weatherStatus').innerText = weatherInfo.desc;
        document.getElementById('weatherSubtext').innerText = `${weatherInfo.desc} 상태입니다`;
        document.getElementById('minMaxTemp').innerText = `${minTemp}° / ${maxTemp}°`;
        document.getElementById('apparentTemp').innerText = `${apparentTemp}°C`;
        document.getElementById('humidityVal').innerText = `${humidity}% 💧`;
        document.getElementById('weatherNotice').innerText = weatherInfo.tip;

      } catch (err) {
        console.error('날씨 데이터 로드 실패:', err);
        document.getElementById('weatherStatus').innerText = '날씨 정보 갱신 실패';
        document.getElementById('weatherNotice').innerText = '날씨 정보를 불러오지 못했습니다. 잠시 후 재시도합니다.';
      }
    }

    // 메뉴 항목별 어울리는 이모지 매칭
    function getMenuEmoji(dishName) {
      if (/밥|볶음|덮밥|비빔/i.test(dishName)) return '🍚';
      if (/국|찌개|탕|스프|수프/i.test(dishName)) return '🍲';
      if (/닭|치킨|날개|봉/i.test(dishName)) return '🍗';
      if (/고기|돈까스|너비아니|불고기|갈비|스테이크|삼겹/i.test(dishName)) return '🥩';
      if (/생선|새우|오징어|해물|어묵|생선까스/i.test(dishName)) return '🐟';
      if (/면|스파게티|국수|파스타|우동/i.test(dishName)) return '🍝';
      if (/샐러드|무침|김치|겉절이|나물/i.test(dishName)) return '🥗';
      if (/과일|사과|포도|샤인|딸기|바나나|귤|오렌지/i.test(dishName)) return '🍇';
      if (/우유|요구르트|치즈|음료|주스|에이드/i.test(dishName)) return '🧃';
      if (/빵|케이크|쿠키|파이|떡/i.test(dishName)) return '🍞';
      return '🍱';
    }

    // 나이스 API로 급식 정보 가져오기
    async function fetchNeisLunch(targetDate) {
      const year = targetDate.getFullYear();
      const month = String(targetDate.getMonth() + 1).padStart(2, '0');
      const date = String(targetDate.getDate()).padStart(2, '0');
      const ymd = `${year}${month}${date}`;

      const listContainer = document.getElementById('lunchMenuList');
      const calorieContainer = document.getElementById('lunchCalorie');
      const subtextContainer = document.getElementById('lunchStatusSubtext');

      const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json&ATPT_OFCDC_SC_CODE=${NEIS_CONFIG.officeCode}&SD_SCHUL_CODE=${NEIS_CONFIG.schoolCode}&MMEAL_SC_CODE=${NEIS_CONFIG.mealCode}&MLSV_YMD=${ymd}`;

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('네트워크 응답 오류');

        const data = await response.json();

        // 급식 데이터가 없는 경우 (주말, 공휴일, 방학 등)
        if (!data.mealServiceDietInfo || !data.mealServiceDietInfo[1] || !data.mealServiceDietInfo[1].row) {
          showNoMealMessage();
          return;
        }

        const mealData = data.mealServiceDietInfo[1].row[0];
        const rawDishes = mealData.DDISH_NM; // 예: "찰흑미밥<br/>쇠고기미역국(5.6.16)<br/>..."
        const calorie = mealData.CAL_INFO || '';

        // 1. <br/> 태그 기준으로 자르기
        const dishList = rawDishes.split(/<br\s*[\/]?>/gi);

        // 2. 알레르기 번호 제거 및 정리
        // 숫자, 쉼표, 마침표, 별표 등이 들어간 괄호 제거 (예: (1.2.5.6), (13.*), (1, 5))
        const cleanedDishes = dishList.map(dish => {
          return dish
            .replace(/\([0-9\.\,\*\s]+\)/g, '') // (1.2.5.6) 형태 제거
            .replace(/\(\)/g, '')               // 빈 괄호 제거
            .trim();
        }).filter(dish => dish.length > 0);

        if (cleanedDishes.length === 0) {
          showNoMealMessage();
          return;
        }

        // 급식 목록 렌더링
        listContainer.innerHTML = cleanedDishes.map(dish => {
          const emoji = getMenuEmoji(dish);
          return `
            <li class="flex items-center gap-3 p-2.5 rounded-2xl bg-white/60 hover:bg-white/90 transition-all">
              <span class="text-xl lg:text-2xl">${emoji}</span>
              <span class="meal-item text-xl sm:text-2xl lg:text-3xl font-bold tracking-tight">${dish}</span>
            </li>
          `;
        }).join('');

        subtextContainer.innerText = '골고루 맛있게 먹어요!';
        calorieContainer.innerText = calorie ? `열량: ${calorie}` : '맛있는 점심 시간';

      } catch (err) {
        console.error('급식 정보 로드 실패:', err);
        showNoMealMessage();
      }
    }

    // 급식이 없을 때 보여줄 화면
    function showNoMealMessage() {
      const listContainer = document.getElementById('lunchMenuList');
      const calorieContainer = document.getElementById('lunchCalorie');
      const subtextContainer = document.getElementById('lunchStatusSubtext');

      subtextContainer.innerText = '즐겁고 편안한 시간 보내세요';
      calorieContainer.innerText = '급식 일정 없음';

      listContainer.innerHTML = `
        <div class="h-full flex flex-col items-center justify-center text-center py-8">
          <div class="text-6xl lg:text-7xl mb-3">🍯</div>
          <p class="text-2xl sm:text-3xl lg:text-4xl font-black text-slate-700 tracking-tight">
            오늘은 급식이 없어요
          </p>
          <p class="text-slate-400 font-semibold mt-2 text-base lg:text-lg">
            주말, 휴일 또는 방학 기간입니다
          </p>
        </div>
      `;
    }

    // 1초마다 시계 & 날짜 갱신 함수
    function updateClock() {
      const now = new Date();

      // 날짜 계산
      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const date = now.getDate();

      const currentDateFormatted = `${year}-${String(month).padStart(2, '0')}-${String(date).padStart(2, '0')}`;

      // 날짜가 변경되었으면(자정 지남 등) 급식 새로 불러오기
      if (lastLoadedDateStr !== currentDateFormatted) {
        lastLoadedDateStr = currentDateFormatted;
        fetchNeisLunch(now);
      }

      const daysOfWeek = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
      const dayName = daysOfWeek[now.getDay()];

      document.getElementById('currentDate').innerText = `${year}년 ${month}월 ${date}일`;
      document.getElementById('currentDay').innerText = dayName;

      // 시간 계산 (12시간제 & 오전/오후)
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      const ampm = hours >= 12 ? '오후' : '오전';
      hours = hours % 12;
      hours = hours ? hours : 12; // 0시는 12시로 표시
      const strHours = String(hours).padStart(2, '0');

      document.getElementById('timeAmpm').innerText = ampm;
      document.getElementById('timeClock').innerText = `${strHours}:${minutes}:${seconds}`;
    }

    // 초기 실행 및 1초 타이머 시작
    updateClock();
    setInterval(updateClock, 1000);

    // 날씨 초기 로드 및 30분(1800000ms) 간격 주기적 새로고침
    fetchSchoolWeather();
    setInterval(fetchSchoolWeather, 30 * 60 * 1000);

    // 전체화면 토글 기능 (교실 스마트 TV, 빔프로젝터용)
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.warn(`전체화면 오류: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // 선생님을 위한 간이 텍스트 직접 편집 모드 토글
    let isEditing = false;
    function toggleEditMode() {
      isEditing = !isEditing;
      const editableElements = document.querySelectorAll('.meal-item, #weatherTemp, #weatherStatus, #weatherSubtext, #weatherNotice');
      const btn = document.getElementById('editToggleBtn');
      const toast = document.getElementById('editNoticeToast');

      editableElements.forEach(el => {
        el.contentEditable = isEditing ? "true" : "false";
        if (isEditing) {
          el.classList.add('outline-dashed', 'outline-2', 'outline-amber-400', 'bg-amber-50/50', 'rounded-md', 'px-1');
        } else {
          el.classList.remove('outline-dashed', 'outline-2', 'outline-amber-400', 'bg-amber-50/50', 'rounded-md', 'px-1');
        }
      });

      if (isEditing) {
        btn.classList.add('bg-amber-100', 'text-amber-900', 'border-amber-400');
        btn.innerHTML = `<i data-lucide="check" class="w-4 h-4 text-emerald-600"></i><span>수정 완료</span>`;
        toast.classList.remove('opacity-0', 'pointer-events-none');
        setTimeout(() => toast.classList.add('opacity-0', 'pointer-events-none'), 3500);
      } else {
        btn.classList.remove('bg-amber-100', 'text-amber-900', 'border-amber-400');
        btn.innerHTML = `<i data-lucide="edit-3" class="w-4 h-4 text-sky-600"></i><span>내용 수정</span>`;
      }
      lucide.createIcons();
    }
  </script>
</body>
</html>
